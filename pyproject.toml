[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cna-python"
version = "0.0.0"
description = "Python binding for the native CNA game framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "openeggbert" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Microsoft Public License (Ms-PL)",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/openeggbert/cna-python"
Repository = "https://github.com/openeggbert/cna-python"
Issues = "https://github.com/openeggbert/cna-python/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
